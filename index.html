<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kevin Thomas – Data Analytics, Cloud & AI</title>
    <meta
      name="description"
      content="Portfolio of Kevin Thomas: Data Analytics master's student, software engineer, and Cloud & AI enthusiast based in Hildesheim, Germany."
    />
    <script>
      // Apply saved/system theme before paint to avoid a flash
      try {
        const t = localStorage.getItem('theme')
        const dark = t ? t === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches
        document.documentElement.classList.toggle('dark', dark)
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
